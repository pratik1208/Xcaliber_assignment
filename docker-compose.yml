services:
  postgres:
    image: postgres:15
    environment: {POSTGRES_USER: p360, POSTGRES_PASSWORD: p360, POSTGRES_DB: patient360}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U p360"], interval: 3s, retries: 20}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://p360:p360@postgres:5432/patient360
      CHROMA_PATH: /srv/chroma_data
    volumes: ["chroma:/srv/chroma_data"]
    depends_on: {postgres: {condition: service_healthy}}
    command: sh -c "python scripts/generate_data.py && python scripts/ingest.py && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  ui:
    build: .
    environment: {API_URL: "http://api:8000"}
    depends_on: [api]
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
volumes: {chroma: {}}
